services:
  postgres:
    image: postgres:16-alpine
    container_name: restokar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: restokar
      POSTGRES_PASSWORD: restokar
      POSTGRES_DB: restokar
    ports:
      - "5433:5432"
    volumes:
      - restokar-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restokar -d restokar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  restokar-pgdata:
