services:
  postgres:
    image: postgres:16-alpine
    container_name: menuland-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: menuland
      POSTGRES_PASSWORD: menuland
      POSTGRES_DB: menuland
    ports:
      - "5433:5432"
    volumes:
      - menuland-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menuland -d menuland"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  menuland-pgdata:
